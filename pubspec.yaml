name: undian_bank
description: Aplikasi undian berhadiah PT. BPR Bank Bulungan (Flutter Windows) - window operator + window penonton.
publish_to: 'none'
version: 1.0.17+18

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.1
  screen_retriever: ^0.2.2 # posisi otomatis layar penonton di monitor ke-2
  sqflite_common_ffi: ^2.3.6
  path_provider: ^2.1.5
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^8.1.7
  intl: ^0.20.2
  path: ^1.9.1 # dipakai langsung oleh lib/core/database.dart & history_tab.dart
  audioplayers: ^6.7.1
  ffi: ^2.1.4 # FFI untuk jalur cadangan audio Windows (winmm PlaySound)
  pdf: ^3.11.3 # export kupon ke PDF siap cetak

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/tick.wav
    - assets/sounds/fanfare.wav
    - assets/samples/contoh-hadiah.csv
    - assets/samples/contoh-nasabah.csv
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
