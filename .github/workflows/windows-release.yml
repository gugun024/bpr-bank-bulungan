# Build otomatis aplikasi Windows (PT. BPR Bank Bulungan).
#
# Cara pakai:
#   - Push biasa ke main  -> build jalan, hasil bisa diunduh di tab Actions
#                           (artifacts, 90 hari).
#   - Push tag v*          -> build jalan + GitHub Release dibuat otomatis
#                           dengan file .zip terlampir. Contoh:
#                               git tag v1.0.0 && git push origin v1.0.0
#   - Manual               -> tab Actions > Build Windows Release > Run workflow.

name: Build Windows Release

on:
  push:
    branches: [main]
    # Hemat: build hanya jalan kalau file kode berubah.
    # Edit README/docs saja -> workflow di-skip otomatis.
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'installer/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Jenis kenaikan versi (patch=1.0.0→1.0.1, minor=1.0.0→1.1.0, major=1.0.0→2.0.0)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # untuk membuat GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Naikkan versi (patch/minor/major)
        id: bump
        if: github.event_name == 'workflow_dispatch'
        shell: python
        run: |
          import os, pathlib, re
          p = pathlib.Path("pubspec.yaml")
          src = p.read_text(encoding="utf-8")
          m = re.search(r"^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?",
                        src, re.M)
          assert m, "format version di pubspec.yaml tidak dikenal"
          major, minor, patch = (int(m.group(1)), int(m.group(2)),
                                  int(m.group(3)))
          build = int(m.group(4) or 0)
          kind = "${{ inputs.bump }}"
          if kind == "major":
              major, minor, patch = major + 1, 0, 0
          elif kind == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          build += 1
          new = f"{major}.{minor}.{patch}+{build}"
          tag = f"v{major}.{minor}.{patch}"
          src = re.sub(r"^version:\s*.*", f"version: {new}",
                       src, count=1, flags=re.M)
          p.write_text(src, encoding="utf-8")
          print(f"version -> {new} (tag {tag})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new_version={new}\n")
              f.write(f"tag={tag}\n")

      - name: Commit kenaikan versi
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add pubspec.yaml
          git commit -m "Rilis ${{ steps.bump.outputs.tag }} [skip ci]"
          git push origin main

      - name: Generate Windows runner
        run: flutter create --platforms=windows .

      - name: Hapus widget_test.dart bawaan (tidak dipakai)
        # flutter create selalu generate test/widget_test.dart contoh
        # (aplikasi counter) yang error di project ini.
        shell: pwsh
        run: |
          Remove-Item -Path "test/widget_test.dart" -ErrorAction SilentlyContinue
          Get-ChildItem test/

      - name: Patch flutter_window.cpp (registrasi plugin sub-window)
        # Wajib: tanpa ini window penonton (sub-window) tidak bisa fullscreen
        # karena plugin window_manager tidak terdaftar di engine keduanya.
        # Lihat README > "Cara build di PC Windows" langkah 3.
        shell: python
        run: |
          import pathlib
          p = pathlib.Path("windows/runner/flutter_window.cpp")
          src = p.read_text(encoding="utf-8")

          include = '#include "desktop_multi_window/desktop_multi_window_plugin.h"'
          if "desktop_multi_window_plugin.h" not in src:
              anchor = '#include "flutter/generated_plugin_registrant.h"'
              assert anchor in src, "anchor include tidak ditemukan"
              src = src.replace(anchor, anchor + "\n" + include, 1)

          callback = """  DesktopMultiWindowSetWindowCreatedCallback([](void* controller) {
                auto* flutter_view_controller =
                    reinterpret_cast<flutter::FlutterViewController*>(controller);
                auto* registry = flutter_view_controller->engine();
                RegisterPlugins(registry);
              });
          """
          if "DesktopMultiWindowSetWindowCreatedCallback" not in src:
              anchor = "RegisterPlugins(flutter_controller_->engine());"
              assert anchor in src, "anchor RegisterPlugins tidak ditemukan"
              src = src.replace(anchor, anchor + "\n" + callback, 1)

          p.write_text(src, encoding="utf-8")
          print("flutter_window.cpp patched OK")

          # Nama file .exe: BPR_Bank_Bulungan.exe (bukan undian_bank.exe).
          cmake = pathlib.Path("windows/CMakeLists.txt")
          csrc = cmake.read_text(encoding="utf-8")
          old_binary = 'set(BINARY_NAME "undian_bank")'
          assert old_binary in csrc, "anchor BINARY_NAME tidak ditemukan"
          csrc = csrc.replace(
              old_binary, 'set(BINARY_NAME "BPR_Bank_Bulungan")', 1)
          cmake.write_text(csrc, encoding="utf-8")
          print("CMakeLists.txt BINARY_NAME patched OK")

          # Nama produk di properties file Windows (Task Manager, dsb).
          rc = pathlib.Path("windows/runner/Runner.rc")
          rsrc = rc.read_text(encoding="utf-8")
          rsrc = rsrc.replace(
              'VALUE "FileDescription", "undian_bank"',
              'VALUE "FileDescription", "PT. BPR Bank Bulungan - Aplikasi Undian"')
          rsrc = rsrc.replace(
              'VALUE "ProductName", "undian_bank"',
              'VALUE "ProductName", "PT. BPR Bank Bulungan"')
          rc.write_text(rsrc, encoding="utf-8")
          print("Runner.rc patched OK")

      - name: Ambil dependencies
        run: flutter pub get

      - name: Analisis
        run: flutter analyze

      - name: Build Windows (.exe rilis)
        run: flutter build windows --release

      - name: Zip hasil build
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (!(Test-Path $out)) { throw "Folder hasil build tidak ditemukan: $out" }
          Compress-Archive -Path "$out/*" -DestinationPath "PT-BPR-Bank-Bulungan-windows.zip" -Force
          Get-Item "PT-BPR-Bank-Bulungan-windows.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Build installer (Inno Setup)
        # Hasilnya: installer-output/PT-BPR-Bank-Bulungan-Setup.exe
        # (instalasi per-pengguna, tanpa perlu hak admin).
        # Versi installer diambil dari pubspec.yaml (X.Y.Z, tanpa +build).
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC tidak ditemukan: $iscc" }
          $ver = (Select-String -Path "pubspec.yaml" -Pattern "^version:\s*(\d+\.\d+\.\d+)").Matches.Groups[1].Value
          if (!$ver) { throw "Versi pubspec.yaml tidak ditemukan" }
          (Get-Content "installer/bpr-bank-bulungan.iss" -Raw) -replace "__APP_VERSION__", $ver |
            Set-Content "installer/bpr-bank-bulungan.iss" -NoNewline
          Write-Host "AppVersion installer -> $ver"
          & $iscc "installer/bpr-bank-bulungan.iss"
          Get-Item "installer-output/PT-BPR-Bank-Bulungan-Setup.exe" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT-BPR-Bank-Bulungan-windows
          path: |
            PT-BPR-Bank-Bulungan-windows.zip
            installer-output/PT-BPR-Bank-Bulungan-Setup.exe
          retention-days: 90

      - name: Buat GitHub Release
        # Hanya untuk run manual (pilih patch/minor/major).
        # Push biasa ke main hanya menghasilkan artifact, tanpa Release.
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          files: |
            PT-BPR-Bank-Bulungan-windows.zip
            installer-output/PT-BPR-Bank-Bulungan-Setup.exe
          generate_release_notes: true
